packages:
  - "apps/*"
  - "packages/*"

engineStrict: true
saveExact: true
saveWorkspaceProtocol: true
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - effect@4.0.0-rc.117
  - "@effect/vitest@4.0.0-rc.117"

packageExtensions:
  eslint-plugin-codebase-ai-rules:
    dependencies:
      typescript: 6.0.3

# better-sqlite3 builds the native binding used by the web app and runtime image.
# esbuild's postinstall selects its platform binary, which Vitest uses.
# @swc/core's script adds a wasm fallback; the native binary is optional.
# lefthook installs explicitly in prepare-hooks.mjs, so its postinstall is off.
allowBuilds:
  "@swc/core": false
  better-sqlite3: true
  esbuild: true
  lefthook: false
