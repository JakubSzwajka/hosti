<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hosti is a self-hosted catalog for static bundles AI agents generate." />
    <title>hosti. your bundles, on your VPS</title>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=fraunces:400,900|instrument-sans:400,500,700&display=swap" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/landing.css" />
    <link rel="stylesheet" href="styles/sections.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">skip to content</a>
    <main id="main" class="landing-main">
      <div class="first-screen">
        <header class="page-header shell">
          <a class="brand" href="./" aria-label="hosti home">
            <svg viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Hosti">
              <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="4" />
              <rect x="12" y="12" width="16" height="16" rx="3" stroke="#06707e" stroke-width="4" />
              <rect x="18" y="10" width="4" height="4" fill="currentColor" />
            </svg>
            <span>hosti</span>
          </a>
          <a class="header-link" href="https://github.com/JakubSzwajka/hosti">source on github</a>
        </header>

        <section class="hero shell" aria-labelledby="hero-title">
          <div class="hero-copy">
            <h1 id="hero-title">Your bundles.<br />On your VPS.</h1>
            <p class="hero-lede">A bundle lands private and stays private until the owner shares it.</p>
            <div class="command-block" data-copy-wrap>
              <pre><code>docker compose up -d</code></pre>
              <button class="copy-button" type="button" data-copy="docker compose up -d">copy</button>
              <span class="copy-status" role="status" aria-live="polite"></span>
            </div>
          </div>

          <figure class="proof-art" aria-label="A private bundle card in the catalog" role="img">
            <svg viewBox="0 0 520 390" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22 44.5H498" stroke="var(--line)" />
              <rect x="22.5" y="44.5" width="475" height="305" rx="9.5" fill="var(--card)" stroke="var(--ink)" />
              <path d="M23 78H497" stroke="var(--line)" />
              <circle cx="42" cy="61" r="4" fill="var(--line)" />
              <circle cx="58" cy="61" r="4" fill="var(--line)" />
              <circle cx="74" cy="61" r="4" fill="var(--line)" />
              <text x="103" y="65" fill="var(--muted)" font-family="var(--font-mono)" font-size="13">squad-2026</text>
              <rect x="390" y="54" width="82" height="20" rx="10" fill="var(--pop-wash)" stroke="var(--pop)" />
              <text x="431" y="68" fill="var(--pop)" font-family="var(--font-mono)" font-size="11" text-anchor="middle">private</text>
              <text x="54" y="128" fill="var(--ink)" font-family="var(--font-serif)" font-size="26" font-weight="900">Squad 2026</text>
              <text x="54" y="156" fill="var(--muted)" font-family="var(--font-sans)" font-size="14">current revision · 8 files</text>
              <path d="M54 191H466" stroke="var(--line-soft)" />
              <path d="M54 226H294" stroke="var(--ink)" stroke-width="2" />
              <path d="M54 249H390" stroke="var(--line)" stroke-width="2" />
              <path d="M54 272H346" stroke="var(--line)" stroke-width="2" />
              <path d="M54 308H138" stroke="var(--pop)" stroke-width="2" />
              <path d="M146 308H230" stroke="var(--line)" stroke-width="2" />
              <path d="M238 308H322" stroke="var(--line)" stroke-width="2" />
            </svg>
          </figure>
        </section>
      </div>
    </main>

    <footer class="page-footer shell">
      <a class="brand" href="./" aria-label="hosti home">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Hosti">
          <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="4" />
          <rect x="12" y="12" width="16" height="16" rx="3" stroke="#06707e" stroke-width="4" />
          <rect x="18" y="10" width="4" height="4" fill="currentColor" />
        </svg>
        <span>hosti</span>
      </a>
      <a class="footer-repo" href="https://github.com/JakubSzwajka/hosti">github.com/JakubSzwajka/hosti</a>
      <p class="register">one VPS, one domain, one person</p>
    </footer>
    <script>
      document.querySelectorAll('[data-copy-wrap]').forEach((wrap) => {
        const button = wrap.querySelector('[data-copy]');
        const status = wrap.querySelector('.copy-status');
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
            status.textContent = 'copied';
          } catch {
            status.textContent = 'select the command to copy it';
          }
        });
      });
    </script>
  </body>
</html>
