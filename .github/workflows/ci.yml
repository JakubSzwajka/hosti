name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository.
env:
  TURBO_TELEMETRY_DISABLED: "1"
permissions:
  contents: read

# A new push to the same branch or PR makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # .nvmrc pins the Node line. package.json engines and the base image in
      # apps/web/Dockerfile follow the same version.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Docker image
        run: docker build -f apps/web/Dockerfile .
