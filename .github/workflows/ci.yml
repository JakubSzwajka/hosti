name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch or PR makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # .nvmrc pins the Node line. package.json engines and the base image in
      # apps/web/Dockerfile follow the same version.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -f apps/web/Dockerfile .
