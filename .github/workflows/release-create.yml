name: Create release

# hosti copy of the gated release profile. The reference lives in
# JakubSzwajka/drunk-cat-stack; keep this copy in step by hand. docs/release.md
# lists where it differs.
#
# Cuts a versioned release out of whatever has accumulated on main, then deploys it.
#
# A merge to main ships nothing and builds nothing. This workflow is the release,
# end to end: it builds the prod image for the commit ("Publish image"), picks the
# next semver, writes release notes from the commit subjects since the last
# release, creates the `vX.Y.Z` tag and GitHub Release, aliases the image with the
# version, and hands the version to "Deploy prod".
#
# Running this workflow IS the approval: private repos on GitHub Free get no
# environment reviewers, and an app that migrates its database on start changes
# production the moment it deploys.
# Use `dry_run` to see what a release contains before committing to it.
#
# The Git tag is the source of truth for the version; the package.json `version`
# fields are not maintained and mean nothing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      version:
        description: "Explicit version instead of a bump (e.g. v1.0.0). Overrides the choice above."
        type: string
        required: false
      deploy:
        description: Deploy to prod after tagging
        type: boolean
        default: true
      dry_run:
        description: Preview the version and release notes without building, tagging or deploying
        type: boolean
        default: false

concurrency:
  group: hosti-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Build first, tag second: a tag can never become public without the image
  # behind it, because a failed build stops the release before it is tagged.
  #
  # Skipped on dry_run: a preview should cost nothing.
  build:
    name: Build release image
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  tag:
    name: Tag and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    # Releases come from main only — a release cut from a feature branch would tag a
    # commit that is not on main, which Deploy prod refuses anyway. `always()` is
    # what lets a dry run through: `build` is skipped there, and a skipped dependency
    # would otherwise skip this job too.
    if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.dry_run || needs.build.result == 'success') }}
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha12: ${{ steps.version.outputs.sha12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          prev="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          first_release=false
          if [ -z "$prev" ]; then
            prev="v0.0.0"
            first_release=true
          fi

          if [ -n "${EXPLICIT}" ]; then
            next="${EXPLICIT}"
            case "$next" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "version must look like v1.2.3, got '${next}'" >&2; exit 1 ;;
            esac
          else
            IFS='.' read -r major minor patch <<< "${prev#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "unknown bump '${BUMP}'" >&2; exit 1 ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "Tag ${next} already exists." >&2
            exit 1
          fi

          {
            echo "version=${next}"
            echo "previous=${prev}"
            echo "first_release=${first_release}"
            echo "sha12=${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

          echo "${prev} -> ${next} at ${GITHUB_SHA:0:12}"

      # The notes go to a file and stay there. Commit subjects are untrusted text
      # as far as the shell is concerned — one backtick or $(…) in a PR title would
      # execute if this were interpolated into a later `run:` block.
      - name: Build release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          FIRST_RELEASE: ${{ steps.version.outputs.first_release }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA12: ${{ steps.version.outputs.sha12 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Non-merge commit subjects are the notes. The first release has no
          # predecessor to diff against, so cap it at recent history rather than
          # replaying the entire repo.
          if [ "$FIRST_RELEASE" = "true" ]; then
            entries="$(git log --no-merges --max-count=50 --pretty='- %s')"
            range_note="_First release — showing the 50 most recent commits._"
          else
            entries="$(git log --no-merges --pretty='- %s' "${PREVIOUS}..HEAD")"
            range_note="[Full diff](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${VERSION})"
          fi

          if [ -z "$entries" ]; then
            echo "Nothing has landed since ${PREVIOUS}; there is nothing to release." >&2
            exit 1
          fi

          {
            echo "## What's in this release"
            echo ""
            printf '%s\n' "$entries"
            echo ""
            printf '%s\n' "$range_note"
            echo ""
            echo "Image: \`prod-sha-${SHA12}\` (aliased as \`${VERSION}\`)"
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Preview (dry run)
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        shell: bash
        run: |
          {
            echo "### Dry run — nothing was built, tagged or deployed"
            echo ""
            echo "Next version: \`${VERSION}\` (from \`${PREVIOUS}\`)"
            echo ""
            cat /tmp/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      # Convenience aliases only — deploys always target the immutable prod-sha tag.
      # imagetools re-points a tag at the existing manifest; nothing is rebuilt, so
      # the released bits are byte-identical to what the build job produced.
      # `prod-latest` and `latest` move here, at release time, so they always mean
      # "the newest release", never an unreleased build.
      - name: Alias image with the version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA12: ${{ steps.version.outputs.sha12 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          base="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          docker buildx imagetools create \
            --tag "${base}:${VERSION}" \
            --tag "${base}:prod-latest" \
            --tag "${base}:latest" \
            "${base}:prod-sha-${SHA12}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # hosti: never mark an app release latest. The CLI install URL
          # releases/latest/download/hosti-cli.tgz must keep pointing at a cli-v* release.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --latest=false \
            --notes-file /tmp/release-notes.md
          {
            echo "### Released ${VERSION}"
            echo ""
            cat /tmp/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Chained rather than triggered: a tag pushed with GITHUB_TOKEN does not start
  # another workflow run, so "Deploy prod" is called directly.
  #
  # A called workflow can never hold more permission than the calling job grants it,
  # so this call re-grants what deploy-prod.yml's job asks for. Keep them in step:
  # widening the callee's permissions without widening these fails the whole
  # workflow at parse time.
  deploy:
    name: Deploy release to prod
    needs: tag
    if: ${{ inputs.deploy && !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-prod.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
