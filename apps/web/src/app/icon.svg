<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Hand drawn, no generator. Two linked pages: one bundle pointing at
       another. Geometry lives on a 32 grid so every edge lands on a whole
       pixel at 16px. The plate carries the light background with it, so the
       mark reads on a light tab strip and a dark one alike. -->
  <title>Hosti</title>
  <rect width="32" height="32" rx="7" fill="#f8fdff"/>
  <rect x="6" y="6" width="12" height="12" rx="1" fill="#ecf2f3"/>
  <rect x="14" y="14" width="12" height="12" rx="1" fill="#ecf2f3"/>
  <rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="#2b3133" stroke-width="4"/>
  <rect x="12" y="12" width="16" height="16" rx="3" fill="none" stroke="#06707e" stroke-width="4"/>
  <!-- The link: teal crosses over ink at the lower left, ink back over teal
       here at the upper right. Without this patch the two only overlap. -->
  <rect x="18" y="10" width="4" height="4" fill="#2b3133"/>
</svg>
