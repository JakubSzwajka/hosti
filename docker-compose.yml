# One service, one named volume. The volume holds both the bundles and the
# SQLite file, so a backup is `tar` over /data.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOSTI_DATA_DIR: /data
      # The origin Hosti prints in push responses. Behind Caddy, set the real
      # hostname here.
      HOSTI_PUBLIC_URL: ${HOSTI_PUBLIC_URL:-http://localhost:3000}
      # Both are required. The catalog refuses to serve admin pages without the
      # password, and a share link cannot take a PIN without the secret.
      HOSTI_OWNER_PASSWORD: ${HOSTI_OWNER_PASSWORD:?set HOSTI_OWNER_PASSWORD in .env}
      HOSTI_SECRET: ${HOSTI_SECRET:?set HOSTI_SECRET in .env, generate with openssl rand -hex 32}
      PORT: "3000"
    ports:
      - "${HOSTI_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - hosti_data:/data

volumes:
  hosti_data:
