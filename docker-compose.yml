# A deployment example: one service, one named volume. The volume holds both
# the bundles and the SQLite file, so a backup is `tar` over /data.
#
# Nothing is built here. `latest` is the newest release: "Create release" moves
# it when it tags a version, and a merge to main does not. The service sets
# `pull_policy: always`, so every `docker compose up` asks the registry for the
# current `latest` instead of reusing whatever the local daemon already has
# under that tag. Pin a version tag such as `:v0.1.0` to stay on one release.
services:
  web:
    image: ghcr.io/jakubszwajka/hosti:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      HOSTI_DATA_DIR: /data
      # The origin Hosti prints in push responses. Behind Caddy, set the real
      # hostname here.
      HOSTI_PUBLIC_URL: ${HOSTI_PUBLIC_URL:-http://localhost:3000}
      # Both are required. The catalog refuses to serve admin pages without the
      # password, and a share link cannot take a PIN without the secret.
      HOSTI_OWNER_PASSWORD: ${HOSTI_OWNER_PASSWORD:?set HOSTI_OWNER_PASSWORD in .env}
      HOSTI_SECRET: ${HOSTI_SECRET:?set HOSTI_SECRET in .env, generate with openssl rand -hex 32}
      PORT: "3000"
    # No host port is published. A reverse proxy on the same Docker network
    # (Dokploy, Traefik, Caddy) targets service `web` on container port 3000,
    # so the box never has to have port 3000 free.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - hosti_data:/data

volumes:
  hosti_data:
